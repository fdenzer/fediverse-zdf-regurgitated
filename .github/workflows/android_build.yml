name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: actions/setup-gradle@v3
      # Gradle wrapper is not present, so this action will use the specified version or a default.
      # AGP 8.2 typically works with Gradle 8.0+. The action's default should be suitable.

    - name: Grant execute permission for gradlew (if it existed)
      run: chmod +x gradlew
      continue-on-error: true # Important if gradlew is not present

    - name: Build with Gradle
      run: gradle build # Using 'gradle' directly as gradlew is not in the project

    # Optional: Upload build artifacts (e.g., APK)
    # - name: Upload APK
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: app-debug-apk
    #     path: app/build/outputs/apk/debug/app-debug.apk
